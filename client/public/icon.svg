<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="MCServerManager Icon">
  <!-- Strictly 2 colors: #1a1a1a (charcoal) and #37abc8 (cyan) -->
  <rect width="64" height="64" rx="13" fill="#1a1a1a" />
  <!-- Top face of isometric Minecraft server block -->
  <polygon points="32,8 54,19 32,30 10,19" fill="#37abc8" />
  <!-- Left face with server rack cutouts -->
  <polygon points="10,23.5 30,33.5 30,55.5 10,45.5" fill="#37abc8" />
  <polygon points="14,30 26,36 26,40 14,34" fill="#1a1a1a" />
  <polygon points="14,39 26,45 26,49 14,43" fill="#1a1a1a" />
  <!-- Right face with console chevron cutout -->
  <polygon points="54,23.5 34,33.5 34,55.5 54,45.5" fill="#37abc8" />
  <polygon points="39,34 49,35.5 49,39.5 39,49 39,44.2 44.2,38.8 39,38" fill="#1a1a1a" />
</svg>
